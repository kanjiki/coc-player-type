name: Promote v3.6 to root

on:
  push:
    paths:
      - '.github/workflows/promote-v36-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Archive v3.5 and promote v3.6
        run: |
          mkdir -p v35
          cp index.html v35/index.html
          cp v36/index.html index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://kanjiki.github.io/coc-player-type/v36/', 'https://kanjiki.github.io/coc-player-type/')
          s = s.replace('<title>CoCプレイヤー診断 v3.6 Pilot</title>', '<title>CoCプレイヤー診断 v3.6</title>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit promoted version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v35/index.html
          git diff --cached --quiet || git commit -m 'Promote v3.6 to root and archive v3.5'
          git push
