name: Improve funnel reliability

on:
  push:
    paths:
      - '.github/workflows/improve-funnel-reliability.yml'
      - 'tools/patch_funnel_reliability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply reliability patch
        run: python tools/patch_funnel_reliability.py
      - name: Commit patched files
        run: |
          rm .github/workflows/improve-funnel-reliability.yml
          rm tools/patch_funnel_reliability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve funnel logging reliability"
          git push origin main
