name: Add related links to v3.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-related-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subtle related links and footer
        shell: python
        run: |
          from pathlib import Path

          targets = [Path('index.html'), Path('v36/index.html')]
          css = '''
          .related-links{margin:30px 0 4px;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--muted)}
          .related-links .related-label{margin:0 0 5px;font-size:.72rem;letter-spacing:.08em;color:#918d86}
          .related-links a{color:var(--muted);font-size:.9rem;text-decoration:none;border-bottom:1px solid #cfc9c0;padding-bottom:1px}
          .related-links a:hover{color:var(--ink);border-color:var(--muted)}
          .site-footer{width:min(850px,calc(100% - 28px));margin:-12px auto 28px;text-align:center;font-size:.76rem;color:#99948d}
          .site-footer a{color:inherit;text-decoration:none}
          .site-footer a:hover{color:var(--muted)}
          '''
          related = '''<div class="related-links"><p class="related-label">他にも作ってます</p><a href="https://kanjiki.github.io/coc-continuation-finder/" target="_blank" rel="noopener noreferrer">この自陣、次どこ行く？</a></div>'''
          footer = '''<footer class="site-footer"><a href="https://kanjiki.github.io/kanjiki-HP/" target="_blank" rel="noopener noreferrer">つまようじ商会</a></footer>'''

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'class="related-links"' not in text:
                  marker = '@media(max-width:560px)'
                  if marker not in text:
                      raise RuntimeError(f'CSS marker missing: {path}')
                  text = text.replace(marker, css + marker, 1)
                  status = '<p id="status" class="status"></p></section>'
                  if status not in text:
                      raise RuntimeError(f'result marker missing: {path}')
                  text = text.replace(status, '<p id="status" class="status"></p>' + related + '</section>', 1)
              if 'class="site-footer"' not in text:
                  main_end = '</main>\n<script>'
                  if main_end not in text:
                      raise RuntimeError(f'main marker missing: {path}')
                  text = text.replace(main_end, '</main>\n' + footer + '\n<script>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v36/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add subtle related links to v3.6"
            git push
          fi
